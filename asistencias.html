<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencias - FitManager</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="transitions.js" defer></script>
</head>

<body class="dashboard-page">
  <div class="dashboard-layout fit-layout">
    <aside class="sidebar fit-sidebar">
      <a class="fit-brand" href="dashboard.html"><img class="fit-brand-logo" src="assets/fitmanager-logo.png" alt="FitManager"> <span>FitManager</span></a>
      <nav class="fit-nav">
        <a href="dashboard.html"><span class="nav-ico">⌂</span> Panel de control</a>
        <a href="miembros.html"><span class="nav-ico">👤</span> Miembros</a>
        <a class="active-link" href="asistencias.html"><span class="nav-ico">📅</span> Asistencias</a>
        <a href="pagos.html"><span class="nav-ico">💳</span> Pagos</a>
        <a href="entrenadores.html"><span class="nav-ico">🏋️</span> Entrenadores</a>
        <a href="acceso.html"><span class="nav-ico">🖐️</span> Acceso</a>
      </nav>
      <a class="logout fit-logout" href="login.html">Salir <span>↪</span></a>
    </aside>

    <main class="main fit-main">
      <header class="page-heading"><div><h1 class="fit-title">Asistencias <span class="punto">●</span></h1>
      <p class="fit-description">Consulta el historial de acceso de los miembros al gimnasio.</p></div></header>

      <section class="fit-card attendance-card">
        <header class="fit-toolbar attendance-toolbar">
          <label class="search-input"><span>🔍</span><input id="buscarAsistencia" type="search" placeholder="Buscar por nombre, cédula o ID..."></label>
        </header>
        <div class="fit-table attendance-table">
          <div class="fit-row fit-head"><span>Miembros</span><span>Historial de asistencias</span><span>Estado</span></div>
          <div id="listaAsistencias"></div>
        </div>
        <footer class="fit-footer attendance-footer">
          <span id="totalAsistencias">Cargando asistencias...</span>
          <div class="pager"><button id="btnAsistenciasAnterior" type="button" title="Ver registros anteriores">Anterior</button><button id="btnAsistenciasSiguiente" type="button" title="Ver más registros">Siguiente</button></div>
        </footer>
      </section>
    </main>
  </div>

  <script src="theme.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api';
    // Ocho asistencias aprovechan la vista sin activar desplazamiento vertical.
    const REGISTROS_POR_PAGINA = 5;
    const listaAsistencias = document.getElementById('listaAsistencias');
    const totalAsistencias = document.getElementById('totalAsistencias');
    const buscarAsistencia = document.getElementById('buscarAsistencia');
    const btnAsistenciasAnterior = document.getElementById('btnAsistenciasAnterior');
    const btnAsistenciasSiguiente = document.getElementById('btnAsistenciasSiguiente');
    let miembros = [];
    let asistencias = [];
    let paginaAsistencias = 1;

    function buscarMiembro(id) {
      return miembros.find((miembro) => Number(miembro.id) === Number(id));
    }

    function parseFecha(valor) {
      if (!valor) return null;
      const partes = String(valor).slice(0, 10).split('-').map(Number);
      if (partes.length !== 3 || partes.some(Number.isNaN)) return null;
      return new Date(partes[0], partes[1] - 1, partes[2]);
    }

    function formatoFecha(valor) {
      const fecha = parseFecha(valor);
      if (!fecha) return 'Sin fecha';
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return `${fecha.getDate()} de ${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
    }

    function obtenerEstadoMiembro(miembroId) {
      const miembro = buscarMiembro(miembroId);
      if (!miembro || miembro.estado !== 'Activo') return { texto: 'Inactivo', clase: 'chip-alert' };
      return { texto: 'Activo', clase: 'chip-ok' };
    }

    function fechaHora(asistencia) {
      return `${formatoFecha(asistencia.fecha)} ${String(asistencia.hora || '').slice(0, 8)}`;
    }

    function resumenMiembro(miembroId) {
      const registros = asistencias
        .filter((item) => Number(item.miembro_id) === Number(miembroId))
        .sort((a, b) => `${String(b.fecha || '').slice(0, 10)} ${String(b.hora || '')}`.localeCompare(`${String(a.fecha || '').slice(0, 10)} ${String(a.hora || '')}`));

      return {
        total: registros.length,
        ultimo: registros[0] ? fechaHora(registros[0]) : 'Sin ingresos'
      };
    }

    function resumenEntrenador(entrenadorId) {
      const registros = asistencias
        .filter((item) => item.tipo === 'Entrenador' && Number(item.entrenador_id) === Number(entrenadorId))
        .sort((a, b) => `${String(b.fecha || '').slice(0, 10)} ${String(b.hora || '')}`.localeCompare(`${String(a.fecha || '').slice(0, 10)} ${String(a.hora || '')}`));

      return {
        total: registros.length,
        ultimo: registros[0] ? fechaHora(registros[0]) : 'Sin ingresos'
      };
    }

    function asistenciasFiltradas() {
      const texto = buscarAsistencia.value.trim().toLowerCase();
      if (!texto) return asistencias;

      return asistencias.filter((asistencia) => {
        const miembro = buscarMiembro(asistencia.miembro_id);
        return [
          miembro ? miembro.nombre : asistencia.miembro_nombre,
          miembro ? miembro.documento : '',
          asistencia.miembro_id,
          asistencia.entrenador_id,
          asistencia.tipo,
          miembro ? miembro.id : ''
        ].some((valor) => String(valor || '').toLowerCase().includes(texto));
      });
    }

    function actualizarBotonesAsistencias(registros) {
      const totalPaginas = Math.max(1, Math.ceil(registros.length / REGISTROS_POR_PAGINA));
      btnAsistenciasAnterior.disabled = paginaAsistencias <= 1;
      btnAsistenciasSiguiente.disabled = paginaAsistencias >= totalPaginas;
    }

    function pintarAsistencias() {
      listaAsistencias.innerHTML = '';
      const filtradas = asistenciasFiltradas();
      const totalPaginas = Math.max(1, Math.ceil(filtradas.length / REGISTROS_POR_PAGINA));

      if (paginaAsistencias > totalPaginas) paginaAsistencias = totalPaginas;

      if (filtradas.length === 0) {
          listaAsistencias.innerHTML = `<div class="fit-row"><strong>${asistencias.length ? 'No se encontraron coincidencias' : 'No hay asistencias registradas'}</strong><span class="muted">${asistencias.length ? 'Prueba con otro nombre, cédula o ID' : 'Usa el modulo de acceso'}</span><span class="chip chip-alert">Sin datos</span></div>`;
          totalAsistencias.textContent = 'Mostrando 0 de 0 asistencias';
          actualizarBotonesAsistencias(filtradas);
          return;
      }

      const inicio = (paginaAsistencias - 1) * REGISTROS_POR_PAGINA;
      const asistenciasPagina = filtradas.slice(inicio, inicio + REGISTROS_POR_PAGINA);

      asistenciasPagina.forEach((asistencia) => {
          const miembro = buscarMiembro(asistencia.miembro_id);
          const esEntrenador = asistencia.tipo === 'Entrenador';
          const estado = esEntrenador ? { texto: 'Entrenador', clase: 'chip-ok' } : obtenerEstadoMiembro(asistencia.miembro_id);
          const resumen = esEntrenador ? resumenEntrenador(asistencia.entrenador_id) : resumenMiembro(asistencia.miembro_id);
          const fila = document.createElement('div');
          fila.className = 'fit-row';
          const nombre = miembro ? miembro.nombre : (asistencia.miembro_nombre || (esEntrenador ? 'Entrenador' : 'Miembro ' + asistencia.miembro_id));
          const identidad = esEntrenador ? asistencia.entrenador_id : (miembro ? miembro.id : asistencia.miembro_id);
          fila.innerHTML = `<div class="fit-person"><span class="user-avatar">${String(nombre).trim().charAt(0).toUpperCase()}</span><span><strong>${nombre}</strong><small>${esEntrenador ? 'Entrenador' : 'Miembro'} · ID: ${identidad}</small><small>Total de ingresos: ${resumen.total}</small></span></div><span class="muted">Ingreso registrado: ${fechaHora(asistencia)}</span><span class="chip ${estado.clase}">${estado.texto}</span>`;
          listaAsistencias.appendChild(fila);
      });

      const fin = Math.min(inicio + REGISTROS_POR_PAGINA, filtradas.length);
      totalAsistencias.textContent = `Mostrando ${asistenciasPagina.length} de ${filtradas.length} asistencias`;
      actualizarBotonesAsistencias(filtradas);
    }

    async function cargarAsistencias() {
      try {
        const [resAsistencias, resMiembros] = await Promise.all([
          fetch(`${API_URL}/asistencias`),
          fetch(`${API_URL}/miembros`)
        ]);

        asistencias = await resAsistencias.json();
        miembros = await resMiembros.json();
        paginaAsistencias = 1;
        pintarAsistencias();
      } catch (error) {
        listaAsistencias.innerHTML = '<div class="fit-row"><strong>No se pudo conectar con la API</strong><span class="muted">Revisa el servidor</span><span class="chip chip-alert">Error</span></div>';
      }
    }

    btnAsistenciasAnterior.addEventListener('click', () => {
      if (paginaAsistencias > 1) {
        paginaAsistencias -= 1;
        pintarAsistencias();
      }
    });

    btnAsistenciasSiguiente.addEventListener('click', () => {
      const totalPaginas = Math.ceil(asistenciasFiltradas().length / REGISTROS_POR_PAGINA);
      if (paginaAsistencias < totalPaginas) {
        paginaAsistencias += 1;
        pintarAsistencias();
      }
    });

    buscarAsistencia.addEventListener('input', () => {
      paginaAsistencias = 1;
      pintarAsistencias();
    });

    cargarAsistencias();
  </script>
</body>

</html>
