<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - FitManager</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="transitions.js" defer></script>
</head>

<body class="auth-page login-page">
  <header class="topbar login-topbar">
    <a class="login-brand" href="index.html" aria-label="Volver al inicio">
      <img src="assets/fitmanager-logo.png" alt="">
      <span>FitManager</span>
    </a>
    <h1>Administrador</h1>
  </header>

  <main class="auth-wrap login-wrap">
    <section class="auth-card login-card">
      <div class="login-heading">
        <h2>Iniciar sesión <span class="punto" aria-label="Activo">●</span></h2>
        <p>Accede al panel de administración de FitManager</p>
      </div>

      <div class="auth-card-body login-body">
        <label for="tipoDocLogin">Tipo de Documento</label>
        <div class="input-with-icon select-with-icon">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h3M8 13h5M16 9h1M16 13h1M6 18v2M18 18v2"/><circle cx="7" cy="10" r="1"/></svg>
          <select id="tipoDocLogin">
            <option value="" disabled selected>Seleccione su Documento...</option>
            <option value="Cedula de ciudadania">Cédula de ciudadanía</option>
            <option value="Tarjeta de identidad">Tarjeta de identidad</option>
            <option value="Cedula de extranjeria">Cédula de extranjería</option>
          </select>
        </div>

        <label for="usuarioLogin">Número de Documento</label>
        <div class="input-with-icon">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c.8-4 3.4-6 8-6s7.2 2 8 6H4z"/></svg>
          <input id="usuarioLogin" type="text" placeholder="Digite su número de Documento..." autocomplete="username">
        </div>

        <label for="contrasenaLogin">Contraseña</label>
        <div class="input-with-icon password-field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
          <input id="contrasenaLogin" type="password" placeholder="Ingrese su contraseña..." autocomplete="current-password">
          <button id="verContrasena" class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>

        <button id="btnLogin" class="btn-main" type="button">INGRESAR</button>
        <p id="mensajeLogin" class="mensaje-form" aria-live="polite"></p>
        <p id="mensajeExito" class="mensaje-exito" aria-live="polite"></p>
      </div>
    </section>

    <div class="auth-links login-links">
      <a href="olvidaste-contrasena.html"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="10" width="12" height="10" rx="1"/><path d="M9 10V7a3 3 0 0 1 6 0v3M12 14v3"/></svg>¿Olvidaste tu contraseña?</a>
      <a href="registro.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3"/><path d="M3 20c.5-4 2.8-6 7-6 2.5 0 4.3.7 5.5 2.1M18 8v6M15 11h6"/></svg><span>Si aun no tienes una cuenta <strong>regístrate aquí</strong></span></a>
    </div>
  </main>

  <div id="loginSuccessOverlay" class="login-success-overlay" hidden role="status" aria-live="assertive">
    <div class="login-success-card"><span class="login-success-check">✓</span><strong>Acceso exitoso</strong><small>Estamos preparando tu panel...</small><span class="login-loader" aria-hidden="true"></span></div>
  </div>

  <script src="theme.js"></script>
  <script>
    const AUTH_ENDPOINTS = [
      'http://localhost:3000/api/auth',
      'http://localhost:8000'
    ];

    async function enviarAuth(path, payload) {
      let ultimoError = null;

      for (const baseUrl of AUTH_ENDPOINTS) {
        try {
          const respuesta = await fetch(`${baseUrl}${path}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await respuesta.json();
          return { ok: respuesta.ok, data };
        } catch (error) {
          ultimoError = error;
        }
      }

      throw ultimoError || new Error('No fue posible conectar con servicios de autenticación');
    }

    const btnLogin = document.getElementById('btnLogin');
    const mensajeLogin = document.getElementById('mensajeLogin');
    const mensajeExito = document.getElementById('mensajeExito');
    const loginSuccessOverlay = document.getElementById('loginSuccessOverlay');
    const contrasenaLogin = document.getElementById('contrasenaLogin');
    const verContrasena = document.getElementById('verContrasena');

    verContrasena.addEventListener('click', function () {
      const mostrar = contrasenaLogin.type === 'password';
      contrasenaLogin.type = mostrar ? 'text' : 'password';
      verContrasena.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
      verContrasena.setAttribute('aria-pressed', String(mostrar));
    });

    btnLogin.addEventListener('click', async function () {
      const tipoDocumento = document.getElementById('tipoDocLogin').value;
      const usuario = document.getElementById('usuarioLogin').value.trim();
      const contrasena = contrasenaLogin.value;
      mensajeLogin.textContent = '';
      mensajeExito.textContent = '';

      if (!tipoDocumento || !usuario || !contrasena) {
        mensajeLogin.textContent = 'Selecciona el tipo de documento y completa los demás campos.';
        return;
      }

      try {
        const resultado = await enviarAuth('/login', { usuario, contrasena, tipoDocumento });

        if (resultado.ok) {
          mensajeExito.textContent = 'Acceso exitoso. Redirigiendo al panel…';
          btnLogin.disabled = true;
          btnLogin.textContent = 'ACCESO EXITOSO';
          loginSuccessOverlay.hidden = false;
          setTimeout(() => {
            if (window.fitNavigate) window.fitNavigate('dashboard.html');
            else window.location.href = 'dashboard.html';
          }, 450);
          return;
        }

        mensajeLogin.textContent = resultado.data?.mensaje || 'Error en la autenticación';
      } catch (error) {
        mensajeLogin.textContent = 'Error de conexión';
      }
    });
  </script>
</body>

</html>
