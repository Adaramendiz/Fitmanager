<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de pagos - FitManager</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="transitions.js" defer></script>
</head>

<body class="payments-page">
  <div class="payments-layout">
    <aside class="sidebar fit-sidebar">
      <a class="fit-brand" href="dashboard.html">
        <img src="assets/fitmanager-logo.png" alt="">
        <span>FitManager</span>
      </a>

      <nav class="fit-nav" aria-label="Menú principal">
        <a href="dashboard.html">Panel de control</a>
        <a href="miembros.html">Miembros</a>
        <a href="asistencias.html">Asistencias</a>
        <a class="active-link" href="pagos.html">Pagos</a>
        <a href="entrenadores.html">Entrenadores</a>
        <a href="acceso.html">Acceso</a>
      </nav>

      <a class="logout fit-logout" href="login.html">Salir</a>
    </aside>

    <main class="payments-main">
      <header class="payments-header">
        <div>
          <h1>Historial de pagos <span class="payments-online" aria-label="Activo"></span></h1>
          <p>Consulta y confirma los pagos registrados de tus miembros.</p>
        </div>
        <div class="payments-calendar-area">
          <button id="btnFiltroFecha" class="payments-calendar-button" type="button" aria-label="Filtrar pagos por fecha" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>
          </button>
          <div id="panelFiltroFecha" class="payments-date-filter" hidden>
            <label for="filtroFecha">Filtrar por fecha</label>
            <input id="filtroFecha" type="date">
            <button id="limpiarFiltroFecha" type="button">Limpiar</button>
          </div>
        </div>
      </header>

      <label class="payments-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="buscarPago" type="search" placeholder="Buscar por nombre, email o ID de cliente...">
      </label>

      <section class="payments-history-card">
        <div class="payments-table-head"><span>Cliente</span><span>Fecha de pago</span><span>Plan</span><span>Membresía</span><span>Método</span><span>Estado</span><span>Monto</span><span aria-hidden="true"></span></div>
        <div id="listaPagos" class="payments-list"></div>
        <footer class="payments-footer"><span id="totalPagos">Cargando pagos...</span><div class="payments-pager"><button id="btnPagosAnterior" type="button">Anterior</button><button id="btnPagosSiguiente" type="button">Siguiente</button></div></footer>
      </section>
    </main>
  </div>

  <script src="theme.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api';
    const listaPagos = document.getElementById('listaPagos');
    const buscarPago = document.getElementById('buscarPago');
    const totalPagos = document.getElementById('totalPagos');
    const btnPagosAnterior = document.getElementById('btnPagosAnterior');
    const btnPagosSiguiente = document.getElementById('btnPagosSiguiente');
    const btnFiltroFecha = document.getElementById('btnFiltroFecha');
    const panelFiltroFecha = document.getElementById('panelFiltroFecha');
    const filtroFecha = document.getElementById('filtroFecha');
    const limpiarFiltroFecha = document.getElementById('limpiarFiltroFecha');
    const REGISTROS_POR_PAGINA = 4;
    let pagos = [];
    let miembros = [];
    let paginaPagos = 1;

    const iconos = {
      calendario: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2"/></svg>',
      plan: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 4.8 5.3.8-3.8 3.7.9 5.2-4.8-2.5-4.8 2.5.9-5.2-3.8-3.7 5.3-.8z"/></svg>',
      tarjeta: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
      efectivo: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9h.1M18 15h.1"/></svg>',
      confirmado: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.3 2.3 4.7-5"/></svg>',
      menu: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>'
    };

    function formatoDinero(valor) { return Number(valor).toLocaleString('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }); }

    function parseFecha(valor) {
      if (!valor) return null;
      const partes = String(valor).slice(0, 10).split('-').map(Number);
      if (partes.length !== 3 || partes.some(Number.isNaN)) return null;
      return new Date(partes[0], partes[1] - 1, partes[2]);
    }

    function formatoFecha(valor) {
      const fecha = parseFecha(valor);
      if (!fecha) return 'Sin fecha';
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return `${fecha.getDate()} de ${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
    }

    function buscarMiembro(id) { return miembros.find((miembro) => Number(miembro.id) === Number(id)); }
    function textoSeguro(valor) { const div = document.createElement('div'); div.textContent = valor || ''; return div.innerHTML; }
    function etiqueta(icono, texto, clase) { return `<span class="payment-tag ${clase}">${icono}<span>${textoSeguro(texto)}</span></span>`; }

    function pintarPagos() {
      const texto = buscarPago.value.trim().toLowerCase();
      const fecha = filtroFecha.value;
      listaPagos.innerHTML = '';

      const filtrados = pagos.filter((pago) => {
        const miembro = buscarMiembro(pago.miembro_id);
        const nombre = miembro ? miembro.nombre : `Miembro ${pago.miembro_id}`;
        const correo = miembro ? miembro.correo || '' : '';
        const coincideBusqueda = [nombre, correo, pago.miembro_id].some((valor) => String(valor || '').toLowerCase().includes(texto));
        const coincideFecha = !fecha || String(pago.fecha_pago || '').slice(0, 10) === fecha;
        return coincideBusqueda && coincideFecha;
      });
      const totalPaginas = Math.max(1, Math.ceil(filtrados.length / REGISTROS_POR_PAGINA));
      if (paginaPagos > totalPaginas) paginaPagos = totalPaginas;
      const inicio = (paginaPagos - 1) * REGISTROS_POR_PAGINA;
      const pagosPagina = filtrados.slice(inicio, inicio + REGISTROS_POR_PAGINA);

      if (filtrados.length === 0) {
        listaPagos.innerHTML = '<article class="payments-empty"><strong>No hay pagos para mostrar</strong><small>Prueba con otra búsqueda o fecha.</small></article>';
        totalPagos.textContent = 'Mostrando 0 de 0 pagos';
        btnPagosAnterior.disabled = true;
        btnPagosSiguiente.disabled = true;
        return;
      }

      pagosPagina.forEach((pago) => {
        const miembro = buscarMiembro(pago.miembro_id);
        const nombre = pago.miembro_nombre || (miembro ? miembro.nombre : 'Cliente sin nombre');
        const correo = miembro ? miembro.correo || 'Sin correo' : pago.cliente_documento || 'Historial conservado';
        const plan = pago.plan || (miembro ? miembro.plan : '') || 'Sin plan';
        const membresia = pago.membresia || (miembro ? miembro.membresia : '') || 'Mensual';
        const metodo = pago.metodo_pago || 'Sin método';
        const inicial = textoSeguro(nombre).trim().charAt(0).toUpperCase() || 'C';
        const articulo = document.createElement('article');
        articulo.className = 'payments-row';
        articulo.innerHTML = `
          <div class="payment-client"><span class="payment-avatar">${inicial}</span><span><strong>${textoSeguro(nombre)}</strong><small>${textoSeguro(correo)}</small></span></div>
          <span class="payment-date">${iconos.calendario}${formatoFecha(pago.fecha_pago)}</span>
          ${etiqueta(iconos.plan, plan, 'plan')}
          ${etiqueta(iconos.calendario, membresia, 'membership')}
          ${etiqueta(metodo.toLowerCase().includes('efectivo') ? iconos.efectivo : iconos.tarjeta, metodo, 'method')}
          <span class="payment-status-cell">${pago.estado === 'Confirmado' ? etiqueta(iconos.confirmado, 'Confirmado', 'confirmed') : `<button class="confirm-payment" type="button">Confirmar pago</button>`}</span>
          <strong class="payment-amount">${formatoDinero(pago.valor)}</strong>
          <button class="payment-menu" type="button" aria-label="Más opciones del pago">${iconos.menu}</button>`;
        const botonConfirmar = articulo.querySelector('.confirm-payment');
        if (botonConfirmar) botonConfirmar.addEventListener('click', () => confirmarPago(pago.id));
        listaPagos.appendChild(articulo);
      });

      totalPagos.textContent = `Mostrando ${pagosPagina.length} de ${filtrados.length} pagos`;
      btnPagosAnterior.disabled = paginaPagos <= 1;
      btnPagosSiguiente.disabled = paginaPagos >= totalPaginas;
    }

    async function confirmarPago(id) {
      try { await fetch(`${API_URL}/pagos/${id}/confirmar`, { method: 'PATCH' }); } finally { cargarPagos(); }
    }

    async function cargarPagos() {
      try {
        const [resPagos, resMiembros] = await Promise.all([fetch(`${API_URL}/pagos`), fetch(`${API_URL}/miembros`)]);
        pagos = await resPagos.json();
        miembros = await resMiembros.json();
        pintarPagos();
      } catch (error) {
        listaPagos.innerHTML = '<article class="payments-empty"><strong>No se pudo conectar con la API</strong><small>Revisa que el servidor esté encendido.</small></article>';
        totalPagos.textContent = 'No fue posible cargar los pagos';
      }
    }

    btnFiltroFecha.addEventListener('click', () => {
      const abierto = !panelFiltroFecha.hidden;
      panelFiltroFecha.hidden = abierto;
      btnFiltroFecha.setAttribute('aria-expanded', String(!abierto));
      if (!abierto) filtroFecha.focus();
    });
    filtroFecha.addEventListener('change', () => { paginaPagos = 1; pintarPagos(); panelFiltroFecha.hidden = true; btnFiltroFecha.setAttribute('aria-expanded', 'false'); });
    limpiarFiltroFecha.addEventListener('click', () => { filtroFecha.value = ''; paginaPagos = 1; pintarPagos(); panelFiltroFecha.hidden = true; btnFiltroFecha.setAttribute('aria-expanded', 'false'); });
    buscarPago.addEventListener('input', () => { paginaPagos = 1; pintarPagos(); });
    btnPagosAnterior.addEventListener('click', () => { if (paginaPagos > 1) { paginaPagos -= 1; pintarPagos(); } });
    btnPagosSiguiente.addEventListener('click', () => { paginaPagos += 1; pintarPagos(); });
    cargarPagos();
  </script>
</body>

</html>
