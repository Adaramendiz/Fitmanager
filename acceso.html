<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - FitManager</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="transitions.js" defer></script>
</head>

<body class="dashboard-page">
  <div class="dashboard-layout fit-layout">
    <aside class="sidebar fit-sidebar">
      <a class="fit-brand" href="dashboard.html"><img class="fit-brand-logo" src="assets/fitmanager-logo.png" alt="FitManager"> <span>FitManager</span></a>
      <nav class="fit-nav">
        <a href="dashboard.html"><span class="nav-ico">⌂</span> Panel de control</a>
        <a href="miembros.html"><span class="nav-ico">👤</span> Miembros</a>
        <a href="asistencias.html"><span class="nav-ico">📅</span> Asistencias</a>
        <a href="pagos.html"><span class="nav-ico">💳</span> Pagos</a>
        <a href="entrenadores.html"><span class="nav-ico">🏋️</span> Entrenadores</a>
        <a class="active-link" href="acceso.html"><span class="nav-ico">🖐️</span> Acceso</a>
      </nav>
      <a class="logout fit-logout" href="login.html">Salir <span>↪</span></a>
    </aside>

    <main class="main fit-main access-page">
      <h1 class="fit-title">Acceso al gimnasio <span class="punto">●</span></h1>
      <p class="fit-description">Registra el ingreso de los miembros mediante su nombre o ID.</p>

      <section class="access-layout">
        <article class="access-terminal">
          <h3>Terminal de Acceso</h3>
          <p>Escanea tu tarjeta o ingresa tu ID</p>
          <div class="scanner"><span>⌕</span></div>
          <div class="access-input-row">
            <input id="inputAccesoMiembro" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ingresa ID del miembro...">
            <button id="btnRegistrarAcceso" type="button" title="Registrar ingreso del miembro">Entrar</button>
          </div>
        </article>

        <aside class="access-details">
          <h3>Detalles del Acceso</h3>
          <div id="detalleAcceso" class="access-detail-message">Esperando escaneo...</div>
        </aside>
      </section>
    </main>
  </div>

  <script src="theme.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api';
    const inputAccesoMiembro = document.getElementById('inputAccesoMiembro');
    const btnRegistrarAcceso = document.getElementById('btnRegistrarAcceso');
    const detalleAcceso = document.getElementById('detalleAcceso');

    function textoSeguro(valor) {
      return String(valor || '').replace(/[&<>"']/g, (caracter) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[caracter]));
    }

    function mostrarDetalle(texto) {
      detalleAcceso.className = 'access-detail-message';
      detalleAcceso.textContent = texto;
    }

    function mostrarFichaAcceso(miembro, accesoRegistrado) {
      const estado = accesoRegistrado ? 'Acceso registrado' : 'Membresía inactiva';
      const claseEstado = accesoRegistrado ? 'access-status-ok' : 'access-status-alert';
      const ingreso = accesoRegistrado ? `${formatoFecha(accesoRegistrado.fecha)} · ${accesoRegistrado.hora}` : 'No autorizado';
      const vigencia = miembro.fecha_vencimiento ? formatoFecha(miembro.fecha_vencimiento) : 'Sin vigencia registrada';

      detalleAcceso.className = 'access-member-card';
      detalleAcceso.innerHTML = `
        <div class="access-member-header">
          <div><span class="access-label">MIEMBRO</span><strong>${textoSeguro(miembro.nombre)}</strong></div>
          <span class="access-status ${claseEstado}">${estado}</span>
        </div>
        <div class="access-info-row"><span>ID del cliente</span><strong>#${textoSeguro(miembro.id)}</strong></div>
        <div class="access-info-row"><span>Ingreso</span><strong>${textoSeguro(ingreso)}</strong></div>
        <div class="access-info-row"><span>Membresía vigente hasta</span><strong>${textoSeguro(vigencia)}</strong></div>`;
    }

    function mostrarFichaEntrenador(entrenador, asistencia) {
      detalleAcceso.className = 'access-member-card';
      detalleAcceso.innerHTML = `
        <div class="access-member-header"><div><span class="access-label">ENTRENADOR</span><strong>${textoSeguro(entrenador.nombre)}</strong></div><span class="access-status access-status-ok">Acceso registrado</span></div>
        <div class="access-info-row"><span>Documento del entrenador</span><strong>${textoSeguro(entrenador.numero_documento || entrenador.id)}</strong></div>
        <div class="access-info-row"><span>Especialidad</span><strong>${textoSeguro(entrenador.especialidad)}</strong></div>
        <div class="access-info-row"><span>Ingreso</span><strong>${textoSeguro(formatoFecha(asistencia.fecha))} · ${textoSeguro(asistencia.hora)}</strong></div>`;
    }

    function fechaActual() {
      return new Date().toISOString().slice(0, 10);
    }

    function parseFecha(valor) {
      if (valor instanceof Date) {
        return new Date(valor.getFullYear(), valor.getMonth(), valor.getDate());
      }
      const partes = String(valor).slice(0, 10).split('-').map(Number);
      return new Date(partes[0], partes[1] - 1, partes[2]);
    }

    function formatoFecha(valor) {
      const fecha = parseFecha(valor);
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return `${fecha.getDate()} de ${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
    }

    function horaActual() {
      return new Date().toTimeString().slice(0, 8);
    }

    async function registrarAcceso() {
      const miembroId = inputAccesoMiembro.value.trim();

      if (!miembroId) {
        mostrarDetalle('Ingresa el ID del miembro.');
        return;
      }

      try {
        const resMiembro = await fetch(`${API_URL}/miembros/${miembroId}`);
        const miembro = await resMiembro.json();

        if (!resMiembro.ok) {
          const resEntrenador = await fetch(`${API_URL}/entrenadores/${miembroId}`);
          const entrenador = await resEntrenador.json();
          if (!resEntrenador.ok) { mostrarDetalle(miembro.mensaje || entrenador.mensaje || 'No se encontró un miembro o entrenador con ese ID.'); return; }
          const fecha = fechaActual(); const hora = horaActual();
          const resAsistenciaEntrenador = await fetch(`${API_URL}/asistencias-entrenadores`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ entrenador_id:entrenador.id, fecha, hora }) });
          const asistenciaEntrenador = await resAsistenciaEntrenador.json();
          if (!resAsistenciaEntrenador.ok) { mostrarDetalle(asistenciaEntrenador.mensaje || 'No se pudo registrar la asistencia del entrenador.'); return; }
          mostrarFichaEntrenador(entrenador, { fecha, hora }); inputAccesoMiembro.value = ''; return;
        }

        if (miembro.estado !== 'Activo') {
          mostrarFichaAcceso(miembro, null);
          return;
        }

        const fecha = fechaActual();
        const hora = horaActual();
        const resAsistencia = await fetch(`${API_URL}/asistencias`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            miembro_id: miembro.id,
            fecha,
            hora
          })
        });

        const asistencia = await resAsistencia.json();

        if (!resAsistencia.ok) {
          mostrarDetalle(asistencia.mensaje || 'No se pudo registrar la asistencia.');
          return;
        }

        mostrarFichaAcceso(miembro, { fecha, hora });
        inputAccesoMiembro.value = '';
      } catch (error) {
        mostrarDetalle('No se pudo conectar con la API.');
      }
    }

    btnRegistrarAcceso.addEventListener('click', registrarAcceso);
    inputAccesoMiembro.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
    });
    inputAccesoMiembro.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        registrarAcceso();
      }
    });
  </script>
</body>

</html>
